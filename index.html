<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10b968"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>แคลอรี่ของฉัน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eefbf3;--card:#fff;--tx:#14301f;--mu:#5f7d6b;--ac:#10b968;--ac2:#d9f7e6;--bd:#d3eedd;--wa:#ff6a3d;--bl:#2f8bff;--am:#ffb020;--aq:#12b5e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a14;--card:#16261d;--tx:#eafff2;--mu:#8fc0a2;--ac:#2fe08a;--ac2:#1b3d2b;--bd:#244434;--wa:#ff8a5c;--bl:#5aa5ff;--am:#ffc14d;--aq:#3fd0f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a14;--card:#16261d;--tx:#eafff2;--mu:#8fc0a2;--ac:#2fe08a;--ac2:#1b3d2b;--bd:#244434;--wa:#ff8a5c;--bl:#5aa5ff;--am:#ffc14d;--aq:#3fd0f5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--ac2),var(--bg) 240px) var(--bg) no-repeat;color:var(--tx);font:15px/1.5 'Noto Sans Thai',system-ui,sans-serif;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);box-shadow:0 2px 12px rgba(16,185,104,.10);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
button,select,input,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.btn{background:linear-gradient(135deg,var(--ac),#12c4b0);color:#fff;border:0;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.g{background:var(--ac2);color:var(--ac)}.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 0 7px;color:var(--mu);font-size:11px;cursor:pointer}nav button b{display:block;font-size:20px}nav .on{color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lab{font-size:12px;color:var(--mu);margin:6px 0 2px}
.chip{display:inline-block;padding:6px 10px;margin:0 6px 6px 0;border-radius:20px;background:var(--ac2);color:var(--ac);font-size:13px;cursor:pointer;border:0}
.tip{background:var(--ac2);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px}
.item{padding:8px 0;border-top:1px solid var(--bd)}svg{max-width:100%;height:auto}
.sc{overflow-x:auto}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const K=['k','p','c','f','s','n','i'],MEALS=['มื้อเช้า','มื้อกลางวัน','มื้อเย็น','ของว่าง'],ACT=[['นั่งทำงาน ไม่ค่อยออกกำลัง',1.2],['ออกกำลังเบา 1-3 วัน/สัปดาห์',1.375],['ออกกำลังปานกลาง 3-5 วัน/สัปดาห์',1.55],['ออกกำลังหนัก 6-7 วัน/สัปดาห์',1.725]];
const FOODS=[['ข้าวสวย 1 จาน',260,5,57,.5,0,2,1],['ข้าวมันไก่ 1 จาน',585,28,68,22,1,880,1],['กะเพราหมูไข่ดาวราดข้าว',620,28,60,28,3,1100,3],['ส้มตำไทย 1 จาน',120,3,22,2,14,1200,4],['ก๋วยเตี๋ยวหมูน้ำ 1 ชาม',400,22,55,10,4,1500,3],['ไข่ต้ม 1 ฟอง',78,6,.6,5,.6,62,0],['กล้วย 1 ผล',105,1,27,.4,14,1,3],['นมจืด 200 มล.',130,7,10,7,10,100,0],['ชานมไข่มุก 500 มล.',450,3,80,12,50,100,1],['อกไก่ย่าง 100 ก.',165,31,0,3.6,0,74,0]];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const lbl=d=>d===today()?'วันนี้':new Date(d+'T12:00').toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r=n=>Math.round(+n||0);
let S={p:null,log:{},w:{},wt:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem('cal1')||'{}'))}catch(e){}S.wt=S.wt||{};
const save=()=>{try{localStorage.setItem('cal1',JSON.stringify(S))}catch(e){}};
let tab='today',D=today(),range=7,aiRes=null,aiBusy=false,sample=null;
(async()=>{try{sample=await claude.use('sample')}catch(e){}R()})();

function T(){const p=S.p;if(!p)return null;
 const bmr=10*p.w+6.25*p.h-5*p.a+(p.sex==='m'?5:-161),tdee=bmr*ACT[p.act][1],adj=p.rate*1100*(p.goal==='lose'?-1:p.goal==='gain'?1:0);
 const k=Math.max(tdee+adj,p.sex==='m'?1500:1200),pr=p.w*(p.goal==='maintain'?1.4:1.8),f=k*.25/9;
 return{bmr,tdee,k,p:pr,f,c:Math.max(0,(k-pr*4-f*9)/4),s:k*.1/4,n:2000,i:14*k/1000,bmi:p.w/Math.pow(p.h/100,2)}}
function tot(d){const a={k:0,p:0,c:0,f:0,s:0,n:0,i:0};(S.log[d]||[]).forEach(e=>K.forEach(x=>a[x]+=+e[x]||0));return a}
const lastW=()=>{const ds=Object.keys(S.w).sort();return ds.length?S.w[ds[ds.length-1]]:S.p?S.p.w:0};

function ring(v,t){const pc=Math.min(v/t,1),over=v>t,C=2*Math.PI*52;
 return `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="65" cy="65" r="52" fill="none" stroke="${over?'var(--wa)':'var(--ac)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" font-size="24" font-weight="700" fill="var(--tx)">${r(v)}</text><text x="65" y="82" text-anchor="middle" font-size="11" fill="var(--mu)">/ ${r(t)} kcal</text></svg>`}
function prog(l,v,t,u,lim){const over=lim&&v>t,pc=Math.min(100,t?v/t*100:0);
 return `<div class="row sp"><span>${l}</span><span class="mu"><b style="color:${over?'var(--wa)':'var(--tx)'}">${r(v)}</b> / ${lim?'≤ ':''}${r(t)} ${u}</span></div><div class="bar"><i style="width:${pc}%;background:${over?'var(--wa)':'var(--ac)'}"></i></div>`}

function waterT(a){const p=S.p,base=Math.round(p.w*33/50)*50,act=[0,150,300,500][p.act]||0,na=a.n>2000?Math.min(500,Math.ceil((a.n-2000)/1000*250/50)*50):0;return{base,act,na,total:base+act+na}}
function addW(ml){S.wt[D]=Math.max(0,(S.wt[D]||0)+ml);save();R()}
function vToday(){const t=T(),a=tot(D),L=S.log[D]||[];
 let h=`<h1>🥗 แคลอรี่ของฉัน</h1><div class="card row sp"><button class="x" onclick="D=addD(D,-1);R()">‹</button><b>${lbl(D)}</b><button class="x" onclick="D=addD(D,1);R()">›</button></div>`;
 if(!t)return h+`<div class="card">เริ่มต้นด้วยการกรอกน้ำหนัก ส่วนสูง และเป้าหมาย เพื่อคำนวณแคลอรี่ที่เหมาะกับคุณ<br><br><button class="btn" onclick="tab='goal';R()">ตั้งเป้าหมาย</button></div>`;
 const left=t.k-a.k;
 h+=`<div class="card"><div class="row sp"><div>${ring(a.k,t.k)}</div><div style="flex:1;padding-left:8px"><div class="mu">${left>=0?'เหลือได้อีก':'เกินเป้า'}</div><div style="font-size:28px;font-weight:700;color:${left>=0?'var(--ac)':'var(--wa)'}">${r(Math.abs(left))}</div><div class="mu">kcal · เป้า ${r(t.k)}</div></div></div></div>`;
 h+=`<div class="card"><h2>สิ่งที่กินแล้ว vs สิ่งที่ควรได้</h2>${prog('โปรตีน',a.p,t.p,'ก.')}${prog('คาร์โบไฮเดรต',a.c,t.c,'ก.')}${prog('ไขมัน',a.f,t.f,'ก.')}${prog('น้ำตาล',a.s,t.s,'ก.',1)}${prog('โซเดียม (เกลือ ≈ '+(a.n*2.5/1000).toFixed(1)+' ก.)',a.n,t.n,'มก.',1)}${prog('ใยอาหาร',a.i,t.i,'ก.')}`;
 const tips=[];if(L.length){if(a.p<t.p*.6&&left<t.k*.4)tips.push('โปรตีนยังน้อย ลองเพิ่มไข่ อกไก่ ปลา หรือเต้าหู้');if(a.s>t.s)tips.push('น้ำตาลเกินคำแนะนำ ลดเครื่องดื่มหวาน');if(a.n>t.n)tips.push('โซเดียมสูงแล้ว ระวังน้ำซุป น้ำจิ้ม ของหมักดอง');if(a.i<t.i*.5&&left<t.k*.4)tips.push('เพิ่มผัก ผลไม้ ธัญพืชเพื่อใยอาหาร');if(left<0)tips.push('วันนี้เกินเป้าแล้ว พรุ่งนี้ปรับได้ ไม่ต้องกังวล')}
 h+=tips.map(x=>`<div class="tip">💡 ${x}</div>`).join('')+'</div>';
 const wd=S.wt[D]||0,wt=waterT(a);
 h+=`<div class="card"><div class="row sp"><h2>💧 ดื่มน้ำ</h2><span class="mu"><b style="color:var(--aq)">${wd}</b> / ${wt.total} มล.</span></div><div class="bar" style="height:12px"><i style="width:${Math.min(100,wd/wt.total*100)}%;background:var(--aq)"></i></div><div class="row"><button class="btn g" onclick="addW(150)">+150</button><button class="btn g" onclick="addW(250)">+250</button><button class="btn g" onclick="addW(500)">+500</button><button class="x" onclick="addW(-250)" title="ย้อนกลับ">↶</button></div><div class="tip">เป้าพื้นฐาน ${wt.base} มล. (33 มล./กก.)${wt.act?` + กิจกรรม ${wt.act}`:''}${wt.na?` + โซเดียมสูง ${wt.na}`:''}${wt.na?'<br>วันนี้โซเดียมสูง ลองดื่มน้ำเพิ่มเล็กน้อยตามความกระหาย':''}<div class="mu">เป็นค่าประมาณ ไม่มีสูตรตายตัว ฟังร่างกายเป็นหลัก ถ้ามีโรคไต หัวใจ หรือหมอจำกัดน้ำ ให้ทำตามที่หมอแนะนำ</div></div></div>`;
 h+=`<div class="card"><div class="row sp"><h2>บันทึกอาหาร</h2><button class="btn g" onclick="tab='add';R()">+ เพิ่ม</button></div>`;
 if(!L.length)h+='<div class="mu">ยังไม่มีรายการ</div>';
 MEALS.forEach((m,mi)=>{const es=L.filter(e=>e.m===mi);if(!es.length)return;h+=`<div class="item"><div class="row sp"><b>${m}</b><span class="mu">${r(es.reduce((s,e)=>s+e.k,0))} kcal</span></div>`+es.map(e=>`<div class="row sp"><div>${esc(e.t)}<div class="mu">P ${r(e.p)} · C ${r(e.c)} · F ${r(e.f)} · น้ำตาล ${r(e.s)} · Na ${r(e.n)}</div></div><div class="row"><b>${r(e.k)}</b><button class="x" onclick="del('${e.id}')">×</button></div></div>`).join('')+'</div>'});
 return h+'</div>'}

function vAdd(){return `<h1>เพิ่มอาหาร</h1>
<div class="card"><h2>✨ ถาม AI / บอกสิ่งที่กิน</h2><textarea id="aiq" rows="3" placeholder="เช่น กินข้าวมันไก่ 1 จาน กับน้ำเปล่า หรือ ถามว่า ไข่ดาว 2 ฟองกี่แคล?"></textarea>
${sample?`<div class="row" style="margin-top:8px"><button class="btn" onclick="ask()" ${aiBusy?'disabled':''}>${aiBusy?'กำลังคิด...':'ถาม AI'}</button></div>`:'<div class="mu" style="margin-top:6px">ฟีเจอร์ AI ไม่พร้อมใช้งานในมุมมองนี้ ใช้เมนูด้านล่างแทนได้</div>'}
<div id="aires">${aiView()}</div></div>
<div class="card"><h2>เลือกมื้อ</h2><select id="meal">${MEALS.map((m,i)=>`<option value="${i}" ${i===curMeal()?'selected':''}>${m}</option>`).join('')}</select></div>
<div class="card"><h2>อาหารยอดนิยม (ค่าประมาณ)</h2>${FOODS.map((f,i)=>`<button class="chip" onclick="quick(${i})">${f[0]} · ${f[1]}</button>`).join('')}</div>
<div class="card"><h2>กรอกเอง</h2><input id="mn" placeholder="ชื่ออาหาร"><div class="grid"><div><div class="lab">แคลอรี่ (kcal)</div><input id="mk" type="number" inputmode="decimal"></div><div><div class="lab">โปรตีน (ก.)</div><input id="mp" type="number" inputmode="decimal"></div><div><div class="lab">คาร์บ (ก.)</div><input id="mc" type="number" inputmode="decimal"></div><div><div class="lab">ไขมัน (ก.)</div><input id="mf" type="number" inputmode="decimal"></div><div><div class="lab">น้ำตาล (ก.)</div><input id="ms" type="number" inputmode="decimal"></div><div><div class="lab">โซเดียม (มก.)</div><input id="mna" type="number" inputmode="decimal"></div><div><div class="lab">ใยอาหาร (ก.)</div><input id="mi" type="number" inputmode="decimal"></div></div><br><button class="btn" onclick="manual()">บันทึก</button></div>`}
const curMeal=()=>{const h=new Date().getHours();return h<10?0:h<15?1:h<20?2:3};
function aiView(){if(!aiRes)return'';let h=`<div class="tip" style="margin-top:10px">${esc(aiRes.answer||'')}</div>`;const it=aiRes.items||[];
 if(it.length){h+=it.map(e=>`<div class="item"><b>${esc(e.t)}</b> · ${r(e.k)} kcal<div class="mu">P ${r(e.p)} · C ${r(e.c)} · F ${r(e.f)} · น้ำตาล ${r(e.s)} · Na ${r(e.n)} · ใย ${r(e.i)}</div></div>`).join('')+`<br><button class="btn" onclick="addAI()">เพิ่มทั้งหมดลงบันทึก</button><div class="mu" style="margin-top:6px">AI ประมาณค่าให้ อาจคลาดเคลื่อนได้</div>`}return h}
async function ask(){const q=document.getElementById('aiq').value.trim();if(!q||aiBusy)return;aiBusy=true;aiRes=null;R();
 const pr=`คุณเป็นนักโภชนาการไทย ประมาณสารอาหารของอาหารตามที่ผู้ใช้บอก (ใช้ปริมาณมาตรฐานไทยถ้าไม่ระบุ) ตอบเป็น JSON เท่านั้น ไม่มี markdown: {"answer":"คำตอบสั้นๆ ภาษาไทย 1-3 ประโยค","items":[{"t":"ชื่อ+ปริมาณ","k":แคลอรี่,"p":โปรตีนก.,"c":คาร์บก.,"f":ไขมันก.,"s":น้ำตาลก.,"n":โซเดียมมก.,"i":ใยอาหารก.}]} ถ้าเป็นเพียงคำถามทั่วไปที่ไม่ใช่อาหาร ให้ items เป็น [] ค่าต้องเป็นตัวเลข\nผู้ใช้: ${q}`;
 try{const v=await sample.json(pr,{modelTier:'quick'});aiRes=v&&typeof v==='object'?v:{answer:String(v)}}catch(e){aiRes={answer:'ขอโทษ ถาม AI ไม่สำเร็จ ลองใหม่อีกครั้ง',items:[]}}
 aiBusy=false;R();const el=document.getElementById('aiq');if(el)el.value=q}
function put(e){const m=+document.getElementById('meal').value;S.log[D]=(S.log[D]||[]).concat({id:Math.random().toString(36).slice(2),m,t:e.t,k:+e.k||0,p:+e.p||0,c:+e.c||0,f:+e.f||0,s:+e.s||0,n:+e.n||0,i:+e.i||0})}
function addAI(){(aiRes.items||[]).forEach(put);aiRes=null;save();tab='today';R()}
function quick(i){const f=FOODS[i];put({t:f[0],k:f[1],p:f[2],c:f[3],f:f[4],s:f[5],n:f[6],i:f[7]});save();tab='today';R()}
function manual(){const g=id=>document.getElementById(id).value,t=g('mn').trim();if(!t||!+g('mk'))return alert('กรอกชื่อและแคลอรี่');put({t,k:g('mk'),p:g('mp'),c:g('mc'),f:g('mf'),s:g('ms'),n:g('mna'),i:g('mi')});save();tab='today';R()}
function del(id){S.log[D]=S.log[D].filter(e=>e.id!==id);save();R()}

function vGoal(){const p=S.p||{sex:'m',a:30,h:170,w:70,gw:65,act:1,goal:'lose',rate:.5},t=T();
 const o=(v,c)=>v===c?'selected':'';
 let h=`<h1>เป้าหมายและร่างกาย</h1><div class="card"><div class="grid"><div><div class="lab">เพศ</div><select id="gs"><option value="m" ${o(p.sex,'m')}>ชาย</option><option value="f" ${o(p.sex,'f')}>หญิง</option></select></div><div><div class="lab">อายุ (ปี)</div><input id="ga" type="number" value="${p.a}"></div><div><div class="lab">ส่วนสูง (ซม.)</div><input id="gh" type="number" value="${p.h}"></div><div><div class="lab">น้ำหนักปัจจุบัน (กก.)</div><input id="gw" type="number" step="0.1" value="${S.p?lastW():p.w}"></div></div>
<div class="lab">กิจกรรม</div><select id="gac">${ACT.map((a,i)=>`<option value="${i}" ${o(p.act,i)}>${a[0]}</option>`).join('')}</select>
<div class="grid"><div><div class="lab">เป้าหมาย</div><select id="gg"><option value="lose" ${o(p.goal,'lose')}>ลดน้ำหนัก</option><option value="maintain" ${o(p.goal,'maintain')}>คงน้ำหนัก</option><option value="gain" ${o(p.goal,'gain')}>เพิ่มน้ำหนัก</option></select></div><div><div class="lab">น้ำหนักเป้าหมาย (กก.)</div><input id="ggw" type="number" step="0.1" value="${p.gw}"></div></div>
<div class="lab">ความเร็ว (กก./สัปดาห์) — แนะนำ 0.25–0.75</div><select id="gr">${[.25,.5,.75,1].map(x=>`<option value="${x}" ${o(p.rate,x)}>${x}</option>`).join('')}</select><br><button class="btn" onclick="saveP()">บันทึกและคำนวณ</button></div>`;
 if(t){const wk=p.goal==='maintain'?0:Math.abs(lastW()-p.gw)/p.rate;
 h+=`<div class="card"><h2>ผลคำนวณ</h2><div class="grid"><div><div class="mu">BMI</div><b style="font-size:20px">${t.bmi.toFixed(1)}</b></div><div><div class="mu">BMR (พลังงานพื้นฐาน)</div><b style="font-size:20px">${r(t.bmr)}</b></div><div><div class="mu">TDEE (ใช้จริง/วัน)</div><b style="font-size:20px">${r(t.tdee)}</b></div><div><div class="mu">เป้าแคลอรี่/วัน</div><b style="font-size:20px;color:var(--ac)">${r(t.k)}</b></div></div><div class="tip">โปรตีน ${r(t.p)} ก. · คาร์บ ${r(t.c)} ก. · ไขมัน ${r(t.f)} ก. · น้ำตาล ≤ ${r(t.s)} ก. · โซเดียม ≤ 2,000 มก. (เกลือ ≈ 5 ก.) · ใยอาหาร ≥ ${r(t.i)} ก.${wk?`<br>คาดว่าถึงเป้าหมายใน ~${Math.ceil(wk)} สัปดาห์`:''}</div><div class="mu" style="margin-top:8px">ใช้สูตร Mifflin-St Jeor เป็นค่าประมาณทั่วไป ไม่ใช่คำแนะนำทางการแพทย์ หากมีโรคประจำตัวควรปรึกษาแพทย์หรือนักกำหนดอาหาร</div></div>
<div class="card"><h2>บันทึกน้ำหนักวันนี้</h2><div class="row"><input id="ww" type="number" step="0.1" value="${lastW()}"><button class="btn" onclick="logW()">บันทึก</button></div></div>`}
 return h+`<div class="card"><button class="btn g" onclick="if(confirm('ลบข้อมูลทั้งหมด?')){S={p:null,log:{},w:{},wt:{}};save();tab='today';R()}">ล้างข้อมูลทั้งหมด</button></div>`}
function saveP(){const g=id=>document.getElementById(id).value,n=id=>+g(id);if(!n('ga')||!n('gh')||!n('gw'))return alert('กรอกข้อมูลให้ครบ');
 S.p={sex:g('gs'),a:n('ga'),h:n('gh'),w:n('gw'),gw:n('ggw')||n('gw'),act:+g('gac'),goal:g('gg'),rate:+g('gr')};S.w[today()]=n('gw');save();tab='today';R()}
function logW(){const v=+document.getElementById('ww').value;if(!v)return;S.w[today()]=v;S.p.w=v;save();R()}

function vChart(){const t=T();let h=`<h1>กราฟและความเปลี่ยนแปลง</h1><div class="card row">${[7,30].map(n=>`<button class="btn ${range===n?'':'g'}" onclick="range=${n};R()">${n} วัน</button>`).join('')}</div>`;
 if(!t)return h+'<div class="card">ตั้งเป้าหมายก่อนเพื่อดูกราฟ</div>';
 const days=[];for(let i=range-1;i>=0;i--)days.push(addD(today(),-i));const vals=days.map(d=>tot(d).k),logged=days.filter(d=>(S.log[d]||[]).length);
 const mx=Math.max(t.k*1.3,...vals),W=340,H=150,bw=W/days.length;
 let bars=days.map((d,i)=>`<rect x="${i*bw+1}" y="${H-vals[i]/mx*H}" width="${Math.max(bw-2,1)}" height="${vals[i]/mx*H}" rx="2" fill="${vals[i]>t.k?'var(--wa)':'var(--ac)'}"/>`).join('');
 h+=`<div class="card"><h2>แคลอรี่รายวัน vs เป้า</h2><svg viewBox="0 0 ${W} ${H+16}"><g>${bars}</g><line x1="0" x2="${W}" y1="${H-t.k/mx*H}" y2="${H-t.k/mx*H}" stroke="var(--bl)" stroke-dasharray="4 3"/><text x="2" y="${H+12}" font-size="9" fill="var(--mu)">${lbl(days[0]).replace('วันนี้','วันนี้')}</text><text x="${W-2}" y="${H+12}" text-anchor="end" font-size="9" fill="var(--mu)">วันนี้</text></svg><div class="mu">เส้นประ = เป้า ${r(t.k)} kcal</div></div>`;
 const avg=K.reduce((o,x)=>(o[x]=logged.length?logged.reduce((s,d)=>s+tot(d)[x],0)/logged.length:0,o),{});
 const pk=avg.p*4,ck=avg.c*4,fk=avg.f*9,sm=(pk+ck+fk)||1;
 h+=`<div class="card"><h2>สัดส่วนสารอาหารเฉลี่ย</h2>${logged.length?`<div class="row" style="height:18px;border-radius:9px;overflow:hidden"><i style="width:${pk/sm*100}%;height:100%;background:var(--bl)"></i><i style="width:${ck/sm*100}%;height:100%;background:var(--am)"></i><i style="width:${fk/sm*100}%;height:100%;background:var(--wa)"></i></div><div class="mu" style="margin-top:6px">🟦 โปรตีน ${r(pk/sm*100)}% · 🟨 คาร์บ ${r(ck/sm*100)}% · 🟧 ไขมัน ${r(fk/sm*100)}%</div><div class="mu">เฉลี่ย/วัน: ${r(avg.k)} kcal · น้ำตาล ${r(avg.s)} ก. · โซเดียม ${r(avg.n)} มก. · ใย ${r(avg.i)} ก.</div>`:'<div class="mu">ยังไม่มีข้อมูล</div>'}</div>`;
 const wd=Object.keys(S.w).sort().filter(d=>d>=days[0]);
 let wc='<div class="mu">บันทึกน้ำหนักอย่างน้อย 2 ครั้งเพื่อดูกราฟ</div>';
 if(wd.length>1){const ws=wd.map(d=>S.w[d]),lo=Math.min(...ws,S.p.gw)-1,hi=Math.max(...ws,S.p.gw)+1,Y=v=>H-(v-lo)/(hi-lo)*H,X=i=>8+i*(W-16)/(wd.length-1);
  wc=`<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${Y(S.p.gw)}" y2="${Y(S.p.gw)}" stroke="var(--ac)" stroke-dasharray="4 3"/><polyline fill="none" stroke="var(--bl)" stroke-width="2.5" points="${ws.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${ws.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--bl)"/>`).join('')}</svg><div class="mu">เส้นประเขียว = น้ำหนักเป้าหมาย ${S.p.gw} กก.</div>`}
 h+=`<div class="card"><h2>น้ำหนัก</h2>${wc}</div>`;
 const all=Object.keys(S.w).sort(),dw=all.length>1?S.w[all[all.length-1]]-S.w[all[0]]:null;
 const est=logged.reduce((s,d)=>s+(tot(d).k-t.tdee),0)/7700;
 h+=`<div class="card"><h2>เทียบความเปลี่ยนแปลง</h2><div class="row sp"><span>น้ำหนักตั้งแต่เริ่ม</span><b>${dw===null?'-':(dw>0?'+':'')+dw.toFixed(1)+' กก.'}</b></div><div class="row sp"><span>กินเฉลี่ยเทียบเป้า</span><b>${logged.length?(avg.k-t.k>0?'+':'')+r(avg.k-t.k)+' kcal':'-'}</b></div><div class="row sp"><span>ประมาณน้ำหนักเปลี่ยน (${logged.length} วันที่บันทึก)</span><b>${logged.length?(est>0?'+':'')+est.toFixed(2)+' กก.':'-'}</b></div><div class="mu" style="margin-top:6px">คำนวณจากแคลอรี่ที่กินเทียบ TDEE (7,700 kcal ≈ 1 กก.) เป็นค่าประมาณ</div></div>`;
 return h}

function R(){document.getElementById('app').innerHTML={today:vToday,add:vAdd,goal:vGoal,chart:vChart}[tab]();
 document.getElementById('nav').innerHTML=[['today','🍽️','วันนี้'],['add','➕','เพิ่ม'],['chart','📈','กราฟ'],['goal','🎯','เป้าหมาย']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="tab='${x[0]}';window.scrollTo(0,0);R()"><b>${x[1]}</b>${x[2]}</button>`).join('')}
R();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
